version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: afiste-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afiste_prod}
      POSTGRES_USER: ${POSTGRES_USER:-afiste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/backup.sh:/backup.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afiste}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afiste-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afiste-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-afiste}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-afiste_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3001
      EXCHANGE_RATE_API: ${EXCHANGE_RATE_API:-https://api.exchangerate-api.com/v4/latest}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY}
      VC_TOKEN_CONTRACT_ADDRESS: ${VC_TOKEN_CONTRACT_ADDRESS}
      TOKEN_OFFERING_CONTRACT_ADDRESS: ${TOKEN_OFFERING_CONTRACT_ADDRESS}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/prisma:/app/prisma:ro
    networks:
      - afiste-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3001/api/v2}
    container_name: afiste-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - afiste-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: afiste-redis-prod
    volumes:
      - redis_data:/data
    networks:
      - afiste-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: afiste-nginx-prod
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - afiste-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  afiste-network:
    driver: bridge

