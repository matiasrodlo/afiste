services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: afiste-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afiste_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afiste-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afiste-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/afiste_development?schema=public
      JWT_SECRET: ${JWT_SECRET:-afiste-production-secret-key-change-this}
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount prisma schema for migrations
      - ./backend/prisma:/app/prisma
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo 'Generating Prisma client...' &&
        npx prisma generate &&
        echo 'Pushing database schema...' &&
        npx prisma db push --accept-data-loss || echo 'Schema push failed, continuing...' &&
        echo 'Seeding database...' &&
        npm run prisma:seed || echo 'Seed failed or already seeded' &&
        echo 'Starting backend server...' &&
        npm start
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - afiste-network

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:3001/api/v2
    container_name: afiste-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - afiste-network

volumes:
  postgres_data:
    driver: local

networks:
  afiste-network:
    driver: bridge

